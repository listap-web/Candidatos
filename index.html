
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal {
      position: relative;
      background: white;
      width: 100%;
      max-width: 600px;
      min-height: 200px;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="close" onclick="window.close()"
              aria-label="Fechar">&times;</button>
      <p>teste</p>
    </div>
  </div>

  <script>
    document.getElementById("overlay").addEventListener("click", function(e) {
      if (e.target === this) {
        window.close();
      }
    });
  </script>
</body>
</html>
