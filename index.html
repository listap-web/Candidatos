
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CV</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: transparent;
  }

  /* Janela pequena, sem fundo cinzento */
  .cv-window {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(400px, calc(100vw - 40px));
    min-height: 150px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    box-sizing: border-box;
    padding: 30px;
    text-align: center;
    z-index: 9999;
  }

  .close {
    position: absolute;
    top: 6px;
    right: 10px;
    border: none;
    background: transparent;
    color: #555;
    font-size: 24px;
    cursor: pointer;
  }

  .cv-content {
    margin-top: 25px;
    font-size: 18px;
    color: #222;
  }
</style>
</head>

<body>

<div class="cv-window" id="cvWindow">
  <button class="close" onclick="document.getElementById('cvWindow').style.display='none'"
          aria-label="Fechar">&times;</button>

  <div class="cv-content">teste</div>
</div>

</body>
</html>
