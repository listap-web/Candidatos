
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}

a {
  color: #1155cc;
  text-decoration: underline;
  cursor: pointer;
  font-size: 16px;
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.janela {
  background: white;
  padding: 40px 60px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.janela h2 {
  color: #172d55;
  font-size: 30px;
}

button {
  background: #941b26;
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<a href="#" onclick="abrirJanela(); return false;">
  Teste
</a>

<div class="overlay" id="overlay">
  <div class="janela">
    <h2>Teste</h2>
    <button onclick="fecharJanela()">Fechar</button>
  </div>
</div>

<script>
function abrirJanela() {
  document.getElementById("overlay").style.display = "flex";
}

function fecharJanela() {
  document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
