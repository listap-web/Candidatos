
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Vitae</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5dfe2;
      color: #333;
    }

    /* Fundo vermelho-claro, suave */
    .fundo {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5dfe2;
    }

    /* Janela branca do CV */
    .janela-cv {
      position: relative;
      width: 100%;
      max-width: 680px;
      min-height: 300px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 48px 42px;
      background: #fff;
      border: 1px solid #ead0d4;
      border-top: 5px solid #8b2332;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(100, 30, 40, 0.14);
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      color: #8b2332;
      font-size: 25px;
      font-weight: 500;
    }

    .conteudo {
      text-align: center;
      font-size: 17px;
      line-height: 1.7;
    }

    .rodape {
      margin-top: 60px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      color: #999;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .fundo {
        padding: 14px;
      }

      .janela-cv {
        padding: 35px 22px;
        min-height: 240px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="fundo">
    <section class="janela-cv">
      <h1>Curriculum Vitae</h1>

      <div class="conteudo">
        teste
      </div>

      <div class="rodape">
        Universidade de Évora
      </div>
    </section>
  </main>
</body>
</html>
