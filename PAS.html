<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    h1 {
  color: #8b2332;
  margin-top: 0;
  text-align: center;
  font-size: 22px;
}

.rodape {
  color: #8b2332;
  border-top: 1px solid #8b2332;
  margin-top: 24px;
  padding-top: 12px;
  font-weight: bold;
  text-align: center;
}
    
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5dfe2;
      color: #333;
    }

    .fundo {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5dfe2;
    }

    .janela {
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 38px 42px;
      background: #fff;
      border: 1px solid #ead0d4;
      border-top: 5px solid #8b2332;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(100, 30, 40, 0.14);
    }

    .texto {
      font-size: 14px;
      line-height: 1.75;
      text-align: justify;
      overflow-wrap: break-word;
    }
    
    .texto p {
      margin: 0 0 1em;
    }

    .texto p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      .fundo {
        padding: 12px;
      }

      .janela {
        padding: 25px 22px;
        max-height: 95vh;
      }

      .texto {
        font-size: 14px;
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>
  <main class="fundo">
    <section class="janela">
     <h1>Candidatos à Assembleia de Revisão Estatutária da UÉ</h1>
      <div class="texto">
        <p>Candidato</p>
      </div>
    
      <div class="rodape">
        Lista P
      </div>
    </section>
    
  </main>
</body>
</html>
